# Optional access from an authorized Tailscale client.
# Use together with server-tele.mysql.yml. SERVER_TELE_TAILSCALE_IP must be
# the actual IPv4 assigned to this Debian server on Tailscale; never 0.0.0.0.
# Use Tailscale ACL/grants to restrict device and TCP/3307 separately.
services:
  mysql:
    ports:
      - "${SERVER_TELE_TAILSCALE_IP:?Set Debian Tailscale IPv4}:3307:3306"
