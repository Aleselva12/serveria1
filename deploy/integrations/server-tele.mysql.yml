# Standalone Magazzino Tele. Never include in Cora's compose.yml.
# Configure private server Tailscale IPv4 and database credentials in a
# non-versioned .env on the Debian host.
name: magazzino-tele
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: magazzino_tele
      MYSQL_USER: servertele
      MYSQL_PASSWORD: ${SERVER_TELE_DB_PASSWORD:?Missing DB password}
      MYSQL_ROOT_PASSWORD: ${SERVER_TELE_ROOT_PASSWORD:?Missing root password}
    volumes:
      - server_tele_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  web:
    build:
      context: ../../apps/magazzino-tele/web
    restart: unless-stopped
    environment:
      TELE_DB_HOST: mysql
      TELE_DB_PORT: "3306"
      TELE_DB_NAME: magazzino_tele
      TELE_DB_USER: servertele
      TELE_DB_PASSWORD: ${SERVER_TELE_DB_PASSWORD:?Missing DB password}
    ports:
      - "${SERVER_TELE_TAILSCALE_IP:?Set Debian Tailscale IPv4}:8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health',timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
volumes:
  server_tele_mysql:
