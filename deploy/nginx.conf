# Only the host-side Tailscale Serve proxy may supply identity. Docker peers
# cannot impersonate it. Configure the exact bridge gateway IP, never a subnet.
geo $cora_serve_peer {
    default 0;
    ${CORA_TAILSCALE_PROXY_IP} 1;
}
map "${CORA_AUTH_MODE}:$cora_serve_peer" $cora_identity {
    default "";
    "tailscale:1" $http_tailscale_user_login;
}
map "${CORA_AUTH_MODE}:$cora_serve_peer" $cora_proxy_secret {
    default "";
    "tailscale:1" "${CORA_TAILSCALE_PROXY_SECRET}";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1024m;
    location /backend/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Cora-Tailscale-Login $cora_identity;
        proxy_set_header X-Cora-Proxy-Secret $cora_proxy_secret;
        proxy_set_header Tailscale-User-Login "";
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
