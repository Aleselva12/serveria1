# Only the host-side Tailscale Serve proxy may supply identity. Docker peers
# cannot impersonate it. Configure the exact bridge gateway IP, never a subnet.
geo $cora_serve_peer {
    default 0;
    ${CORA_TAILSCALE_PROXY_IP} 1;
}
map "${CORA_AUTH_MODE}:$cora_serve_peer" $cora_identity {
    default "";
    "tailscale:1" $http_tailscale_user_login;
}
map "${CORA_AUTH_MODE}:$cora_serve_peer" $cora_proxy_secret {
    default "";
    "tailscale:1" "${CORA_TAILSCALE_PROXY_SECRET}";
}
map $http_upgrade $cora_terminal_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1024m;
    location /terminal/ {
        # Variable resolution keeps the normal UI operational when terminal is disabled.
        resolver 127.0.0.11 valid=10s;
        set $terminal_service terminal:8022;
        proxy_pass http://$terminal_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cora_terminal_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Cora-Tailscale-Login $cora_identity;
        proxy_set_header X-Cora-Proxy-Secret $cora_proxy_secret;
        proxy_set_header Tailscale-User-Login "";
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
        client_max_body_size 16k;
        access_log off;
    }
    # OAuth codes arrive in the static callback query; never log/cache that URL.
    location = /google-calendar-callback.html {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }
    location /backend/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Cora-Tailscale-Login $cora_identity;
        proxy_set_header X-Cora-Proxy-Secret $cora_proxy_secret;
        proxy_set_header Tailscale-User-Login "";
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
