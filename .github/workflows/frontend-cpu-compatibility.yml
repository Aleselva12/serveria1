name: Frontend CPU compatibility
on:
  push:
    paths: ['frontend/**', '.github/workflows/frontend-cpu-compatibility.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-cpu-compatibility.yml']
permissions:
  contents: read
jobs:
  sandybridge-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install CPU emulator
        run: sudo apt-get update -qq && sudo apt-get install -y qemu-user
      - run: npm ci
      - name: Build with Sandy Bridge instructions (no AVX2)
        run: |
          # Emulate both Node/native addons and the separate esbuild process.
          # Otherwise esbuild would still execute on the runner's modern CPU.
          wrapper="$RUNNER_TEMP/esbuild-sandybridge"
          printf '#!/bin/sh\nexec qemu-x86_64 -cpu SandyBridge "%s" "$@"\n' \
            "$PWD/node_modules/@esbuild/linux-x64/bin/esbuild" > "$wrapper"
          chmod +x "$wrapper"
          export ESBUILD_BINARY_PATH="$wrapper"
          qemu-x86_64 -cpu SandyBridge "$(command -v node)" node_modules/typescript/bin/tsc -b
          qemu-x86_64 -cpu SandyBridge "$(command -v node)" node_modules/vite/bin/vite.js build
