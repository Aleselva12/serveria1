name: Verify backend and frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cora_test
          POSTGRES_USER: cora
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cora -d cora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CORA_DATABASE_URL: postgresql://cora:test_password@localhost:5432/cora_test
      CORA_RUNTIME_TEST_DATABASE_URL: postgresql://cora:test_password@localhost:5432/cora_test
      CORA_CALENDAR_TEST_DATABASE_URL: postgresql://cora:test_password@localhost:5432/cora_test
      CORA_EMBEDDING_MODEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-test.txt
      - run: |
          python -c "from core.database import db_connection; c = db_connection(); c.__enter__(); c.__exit__(None, None, None)"
          python -m unittest discover -s tests -v
          python smoke_check.py
      - run: npm ci && npm test && npm run build
        working-directory: frontend
