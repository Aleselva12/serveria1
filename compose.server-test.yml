services:
  api:
    environment:
      CORA_RUNTIME_MODE: server
      CORA_FILE_ROOTS: '[{"id":"drive","label":"Drive NAS","path":"/nas/drive","writable":true},{"id":"cora","label":"Dati Cora","path":"/state/files","writable":true}]'
      # Primo benchmark: niente Whisper/audio; evita che il doctor richieda
      # un modello locale non installato nel target core.
      CORA_WHISPER_LOCAL_ONLY: 'false'
    volumes:
      - type: bind
        source: /srv/nas/Dati/drive
        target: /nas/drive
        read_only: false
        bind:
          create_host_path: false
