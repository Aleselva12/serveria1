# Optional override for a personal Google Calendar shared with the service account.
# Use with: docker compose --env-file deploy.env -f compose.yml -f compose.calendar-service-account.yml up -d --no-deps api
# Never put the private JSON key into this repository or a Docker image.
services:
  api:
    environment:
      CORA_GOOGLE_CALENDAR_SERVICE_ACCOUNT_PATH: /run/cora-secrets/cora-calendar.json
      CORA_GOOGLE_CALENDAR_ID: ${CORA_GOOGLE_CALENDAR_ID:?Set shared calendar ID in deploy.env}
    volumes:
      - type: bind
        source: /srv/cora-secrets/cora-calendar.json
        target: /run/cora-secrets/cora-calendar.json
        read_only: true
        bind:
          create_host_path: false
