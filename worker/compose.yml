# Execute from this directory: docker compose up -d --build
services:
  worker:
    build: .
    container_name: cora-desktop-worker
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
